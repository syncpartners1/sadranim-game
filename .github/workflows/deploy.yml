name: Deploy to Firebase Hosting

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_SADRANIM_GAME || secrets.GCP_SA_KEY }}
        run: |
          echo "$FIREBASE_SA_KEY" > ./sa-deploy-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa-deploy-key.json"
          npx firebase-tools deploy --only hosting --project sadranim-game --non-interactive
          rm -f ./sa-deploy-key.json
