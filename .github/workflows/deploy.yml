name: Deploy to Firebase Hosting

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          KEY_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SADRANIM_GAME }}
          KEY_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY_3: ${{ secrets.GCP_SA_KEY }}
          KEY_4: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          SA_KEY="${KEY_1:-${KEY_2:-${KEY_3:-$KEY_4}}}"
          if [ -z "$SA_KEY" ]; then
            echo "::error::No Firebase secret found in GitHub Secrets. Please add FIREBASE_SERVICE_ACCOUNT_SADRANIM_GAME to Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s\n' "$SA_KEY" > ./sa-key-deploy.json
          node -e "JSON.parse(require('fs').readFileSync('./sa-key-deploy.json'))" || (echo "::error::Invalid JSON in Secret" && exit 1)
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa-key-deploy.json"
          npx firebase-tools deploy --only hosting --project sadranim-game --non-interactive
          rm -f ./sa-key-deploy.json
