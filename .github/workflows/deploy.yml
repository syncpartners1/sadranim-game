name: Deploy to Firebase Hosting

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Authenticate & Deploy to Firebase Hosting using GCP Secret Manager
        env:
          KEY_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SADRANIM_GAME }}
          KEY_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY_3: ${{ secrets.GCP_SA_KEY }}
        run: |
          # 1. Setup fallback key from GitHub Secrets
          FALLBACK_KEY="${KEY_1:-${KEY_2:-$KEY_3}}"
          if [ -n "$FALLBACK_KEY" ]; then
            printf '%s\n' "$FALLBACK_KEY" > ./sa-key-deploy.json
            export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa-key-deploy.json"
          fi

          # 2. Attempt fetching latest key from GCP Secret Manager (sadranim-game)
          if command -v gcloud &> /dev/null && [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "Fetching secret FIREBASE_SERVICE_ACCOUNT_KEY from GCP Secret Manager..."
            gcloud secrets versions access latest --secret="FIREBASE_SERVICE_ACCOUNT_KEY" --project="sadranim-game" > ./gcp-sm-key.json 2>/dev/null || true
            if [ -s ./gcp-sm-key.json ]; then
              mv ./gcp-sm-key.json ./sa-key-deploy.json
              export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa-key-deploy.json"
              echo "Successfully loaded FIREBASE_SERVICE_ACCOUNT_KEY from GCP Secret Manager!"
            fi
          fi

          # 3. Validate JSON format
          node -e "JSON.parse(require('fs').readFileSync('./sa-key-deploy.json'))" || (echo "::error::Invalid JSON secret key" && exit 1)

          # 4. Deploy to Firebase Hosting
          npx firebase-tools deploy --only hosting --project sadranim-game --non-interactive
          rm -f ./sa-key-deploy.json ./gcp-sm-key.json
